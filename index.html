 if(panel==='记录'){renderRecords();return} if(panel==='收藏'){renderFavorites();return} if(panel==='错题'){renderWrong();return}
 const list=allQs(); if(index>=list.length) index=Math.max(0,list.length-1);
 app.innerHTML=`<div class="bar"><input id="search" placeholder="搜索题干/选项…" oninput="renderList()"><span class="pill">${list.length}题</span><button class="tab ${subject==='全部'?'active':''}" onclick="setSubject('全部')">全部</button><button class="tab ${subject==='生理'?'active':''}" onclick="setSubject('生理')">生理</button><button class="tab ${subject==='生化'?'active':''}" onclick="setSubject('生化')">生化</button><button class="tab ${subject==='病理'?'active':''}" onclick="setSubject('病理')">病理</button><button class="tab ${subject==='内科'?'active':''}" onclick="setSubject('内科')">内科</button><button class="tab ${subject==='外科'?'active':''}" onclick="setSubject('外科')">外科</button><button class="tab ${subject==='其他'?'active':''}" onclick="setSubject('其他')">其他</button><button class="tab ${subject==='收藏'?'active':''}" onclick="setSubject('收藏')">⭐收藏</button><button class="tab ${panel==='记录'?'active':''}" onclick="setSubject('记录')">📊记录</button><button class="tab ${panel==='收藏'?'active':''}" onclick="setSubject('收藏')">⭐收藏</button><button class="tab ${panel==='错题'?'active':''}" onclick="setSubject('错题')">❌错题</button><button onclick="openModal()">＋录入</button><button onclick="shuffle()">随机</button><button onclick="downloadCurrent()">⬇ 导出本套卷</button><button onclick="exportPDF()">🖨️ 导出题目＋解析图片 PDF</button></div><div id="list"></div>`; renderList();
}
function setSubject(x){if(['记录','收藏','错题'].includes(x)){panel=x;subject='全部'}else{panel='questions';subject=x}index=0;selected={};submitted={};render()}
function renderList(){
 const el=document.getElementById('list'); if(!el)return; const term=(document.getElementById('search')?.value||'').trim().toLowerCase();
 const list=allQs().filter(q=>!term||(q.question+' '+Object.values(q.options).join(' ')).toLowerCase().includes(term));
 if(term){el.innerHTML=list.length?list.map(q=>card(q)).join(''):'<div class="empty">没有找到题目</div>';return}
 const q=list[index]||allQs()[index]; if(!q){el.innerHTML='<div class="empty">暂无题目</div>';return}
 el.innerHTML=oneCard(q)+pager(allQs().length);
}
function oneCard(q){const r=state.records[q.id]; const done=r&&r.attempts>0; return `<div class="card" id="qcard"><div class="qhead"><span>${q.subject} · ${q.type}</span><span>第 ${q.no} 题</span></div><div class="qtext">${esc(q.question)}</div><div class="opts">${Object.entries(q.options).map(([k,v])=>opt(q,k,v)).join('')}</div>${submitted[q.id]?feedback(q):done?`<div class="feedback">📌 已做过：${r.correct>0&&r.wrong===0?'最近/历史均正确':r.wrong>0&&r.correct===0?'最近/历史均错误':'已有正确和错误记录'}　作答 ${r.attempts} 次，正确 ${r.correct} 次，正确率 ${accuracy(r)}%<br><button onclick="redoQ('${q.id}')" class="primary" style="margin-top:8px">↻ 重做这题</button></div>`:''}<div class="image-box"><b>📷 解析图片</b><div style="margin:7px 0;color:#667085;font-size:13px">可在这里上传本题解析截图；图片会保存到本浏览器。</div>${q.analysisImage?`<img class="analysis-img" src="${q.analysisImage}" alt="解析图片">`:''}<label class="upload-label">${q.analysisImage?'更换解析图片':'选择解析图片'}<input type="file" accept="image/*" onchange="uploadAnalysisImage('${q.id}',this.files[0])"></label>${q.analysisImage?`<button onclick="removeAnalysisImage('${q.id}')">删除图片</button>`:''}</div><div class="actions"><button onclick="toggleRecord(${q.no})">${state.records[q.id]?.favorite?'★已收藏':'☆收藏'}</button><button onclick="openModal(state.questions.find(x=>x.no===${q.no}&&x.setId===currentSet))">✎ 编辑</button><button class="danger" onclick="deleteQ(${q.no})">删除</button><button class="primary" onclick="submitQ(${q.no})">提交答案</button>${submitted[q.id]?`<button onclick="redoQ(\'${q.id}\')">↻ 重做</button>`:''}</div></div>`}
function card(q){return `<div class="card"><div class="qhead"><span>${q.subject} · ${q.type}</span><span>第 ${q.no} 题</span></div><div class="qtext">${esc(q.question)}</div><div class="opts">${Object.entries(q.options).map(([k,v])=>opt(q,k,v)).join('')}</div>${submitted[q.id]?feedback(q):''}</div>`}
function opt(q,k,v){let cls='opt'; if(selected[q.id]===k)cls+=' selected'; if(submitted[q.id]){if(letters(q.answer).includes(k))cls+=' correct'; else if(selected[q.id]===k)cls+=' wrong'} return `<button class="${cls}" onclick="choose('${q.id}','${k}')" ${submitted[q.id]?'disabled':''}><span class="letter">${k}</span><span>${esc(v)}</span></button>`}
function feedback(q){let ok=letters(q.answer).sort().join('')===letters(selected[q.id]||'').sort().join(''); return `<div class="feedback"><b>${ok?'✅ 回答正确':'❌ 回答错误'}</b><br>正确答案：<b>${esc(q.answer)}</b>${q.type==='多选题'?'（需全部选对）':''}<br>${esc(q.analysis)}</div>`}

function uploadAnalysisImage(id,file){if(!file)return; if(!file.type.startsWith('image/'))return alert('请选择图片文件'); const reader=new FileReader(); reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1400;let w=img.width,h=img.height;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);const data=c.toDataURL('image/jpeg',.78);const q=state.questions.find(x=>x.id===id);if(!q)return;q.analysisImage=data;try{saveState();renderList()}catch(e){q.analysisImage='';alert('图片保存失败，可能是浏览器本地存储空间不足。请换一张较小的图片（建议5MB以内）。')}};img.src=reader.result};reader.readAsDataURL(file)}
function removeAnalysisImage(id){const q=state.questions.find(x=>x.id===id);if(!q)return;if(confirm('删除这张解析图片？')){delete q.analysisImage;saveState();renderList()}}
function pager(total){return `<div class="pager"><button onclick="prev()" ${index<=0?'disabled':''}>‹ 上一题</button><span class="progress">第 ${index+1} / ${total} 题</span><button onclick="next()" ${index>=total-1?'disabled':''}>下一题 ›</button></div>`}
function choose(id,k){if(submitted[id])return; const q=state.questions.find(x=>x.id===id); if(q.type==='多选题'){let cur=selected[id]||''; selected[id]=cur.includes(k)?cur.replace(k,''):cur+k;}else selected[id]=k; renderList()}
function submitQ(no){const q=state.questions.find(x=>x.no===no&&x.setId===currentSet); if(!q)return; if(!selected[q.id]){alert('请先选择答案');return} if(submitted[q.id])return; submitted[q.id]=true; const ok=letters(q.answer).sort().join('')===letters(selected[q.id]).sort().join(''); let r=state.records[q.id]||{attempts:0,correct:0,wrong:0,favorite:false}; r.attempts++; ok?r.correct++:r.wrong++; r.last=Date.now(); state.records[q.id]=r; state.history.unshift({id:q.id,no:q.no,ok,time:Date.now()}); state.history=state.history.slice(0,500); saveState(); renderList()}
function next(){if(index<allQs().length-1){index++;renderList();window.scrollTo({top:0,behavior:'smooth'})}}
function prev(){if(index>0){index--;renderList();window.scrollTo({top:0,behavior:'smooth'})}}
function shuffle(){const a=allQs(); if(a.length<2)return; index=Math.floor(Math.random()*a.length);renderList();}
function toggleRecord(no){const q=state.questions.find(x=>x.no===no&&x.setId===currentSet);let r=state.records[q.id]||{attempts:0,correct:0,wrong:0,favorite:false};r.favorite=!r.favorite;state.records[q.id]=r;saveState();renderList()}
function setStats(setId){const qs=state.questions.filter(q=>q.setId===setId);let attempted=0,correct=0,wrong=0,done=0;qs.forEach(q=>{const r=state.records[q.id];if(r&&r.attempts){done++;attempted+=r.attempts;correct+=r.correct;wrong+=r.wrong}});return {total:qs.length,done,attempted,correct,wrong,acc:attempted?Math.round(correct/attempted*100):0}}
function renderRecords(){const app=document.getElementById('app');const st=setStats(currentSet);const qs=state.questions.filter(q=>q.setId===currentSet);const vals=qs.map(q=>state.records[q.id]).filter(Boolean);const fav=vals.filter(r=>r.favorite).length;app.innerHTML=`<h2>📊 做题记录</h2><div class="statgrid"><div class="stat"><div class="num">${st.done}/${st.total}</div><div class="label">本套已做</div></div><div class="stat"><div class="num">${st.attempted}</div><div class="label">总作答次数</div></div><div class="stat"><div class="num">${st.acc}%</div><div class="label">本套整卷正确率</div></div><div class="stat"><div class="num">${fav}</div><div class="label">本套收藏</div></div></div><div class="bar"><button onclick="setSubject('收藏')">⭐ 查看收藏</button><button onclick="setSubject('错题')">❌ 查看错题（${st.wrong}）</button><button onclick="clearRecords()">清空做题记录</button></div><h3>本套卷成绩</h3><div class="feedback">共 ${st.total} 题　已做 ${st.done} 题　正确 ${st.correct} 次　错误 ${st.wrong} 次<br><b>整套卷当前正确率：${st.acc}%</b></div><h3>最近作答</h3>${state.history.filter(h=>qs.some(q=>q.id===h.id)).slice(0,50).map(h=>{let q=state.questions.find(x=>x.id===h.id);return q?`<div class="record"><div><b>第${q.no}题</b> · ${q.subject}<br><small>${new Date(h.time).toLocaleString()} · ${h.ok?'正确':'错误'} · 已作答${state.records[q.id]?.attempts||0}次</small></div><div><button onclick="jumpTo('${q.id}')">查看</button><button onclick="redoQ('${q.id}')">↻ 重做</button></div></div>`:''}).join('')||'<div class="empty">还没有做题记录</div>'}`}
function renderFavorites(){const app=document.getElementById('app');const qs=state.questions.filter(q=>q.setId===currentSet&&state.records[q.id]?.favorite);app.innerHTML=`<h2>⭐ 我的收藏</h2><div class="pill">${qs.length} 道收藏题</div>${qs.map(q=>`<div class="card"><div class="qhead"><span>${q.subject} · ${q.type}</span><span>第 ${q.no} 题</span></div><div class="qtext">${esc(q.question)}</div><div class="opts">${Object.entries(q.options).map(([k,v])=>`<div class="opt"><span class="letter">${k}</span><span>${esc(v)}</span></div>`).join('')}</div><div class="actions"><button onclick="jumpTo('${q.id}')">查看原题</button><button onclick="redoQ('${q.id}')">↻ 重做</button><button onclick="toggleFavoriteById('${q.id}')">取消收藏</button></div></div>`).join('')||'<div class="empty">本套卷还没有收藏题目</div>'}`}
function renderWrong(){const app=document.getElementById('app');const qs=state.questions.filter(q=>q.setId===currentSet&&state.records[q.id]?.wrong>0);app.innerHTML=`<h2>❌ 错题本</h2><div class="pill">${qs.length} 道错题</div>${qs.map(q=>`<div class="card"><div class="qhead"><span>${q.subject} · ${q.type}</span><span>第 ${q.no} 题</span></div><div class="qtext">${esc(q.question)}</div><div class="opts">${Object.entries(q.options).map(([k,v])=>`<div class="opt"><span class="letter">${k}</span><span>${esc(v)}</span></div>`).join('')}</div><div class="feedback">正确答案：<b>${esc(q.answer)}</b><br>累计作答：${state.records[q.id].attempts} 次　错误：${state.records[q.id].wrong} 次　正确率：${accuracy(state.records[q.id])}%${q.analysis?`<br>${esc(q.analysis)}`:''}</div><div class="actions"><button onclick="jumpTo('${q.id}')">查看原题</button><button class="primary" onclick="redoQ('${q.id}')">↻ 重做</button><button onclick="toggleFavoriteById('${q.id}')">${state.records[q.id].favorite?'★ 已收藏':'☆ 收藏'}</button></div></div>`).join('')||'<div class="empty">本套卷暂时没有错题，继续保持！</div>'}`}
function toggleFavoriteById(id){const q=state.questions.find(x=>x.id===id);if(!q)return;let r=state.records[q.id]||{attempts:0,correct:0,wrong:0,favorite:false};r.favorite=!r.favorite;state.records[q.id]=r;saveState();render()}
function redoQ(id){const q=state.questions.find(x=>x.id===id);if(!q)return;currentSet=q.setId;panel='questions';subject='全部';const list=allQs();index=Math.max(0,list.findIndex(x=>x.id===id));selected[id]='';submitted[id]=false;renderSets();render();window.scrollTo({top:0,behavior:'smooth'})}
function jumpTo(id){const q=state.questions.find(x=>x.id===id);if(!q)return;currentSet=q.setId;panel='questions';subject='全部';const list=allQs();index=Math.max(0,list.findIndex(x=>x.id===id));renderSets();render();window.scrollTo({top:0,behavior:'smooth'})}
function clearRecords(){if(confirm('确定清空全部做题记录吗？题目本身不会删除。')){state.records={};state.history=[];saveState();render()}}
function deleteQ(no){if(!confirm('删除第'+no+'题？删除后可通过重新导入本网页恢复原始165题。'))return;state.questions=state.questions.filter(q=>!(q.no===no&&q.setId===currentSet));saveState();index=Math.min(index,Math.max(0,allQs().length-1));render()}
function openModal(q=null){editId=q?.id||null;document.getElementById('modalTitle').textContent=q?'编辑题目':'录入题目';document.getElementById('fQ').value=q?.question||'';['A','B','C','D'].forEach(k=>document.getElementById('f'+k).value=q?.options?.[k]||'');document.getElementById('fSub').value=q?.subject||'内科';document.getElementById('fAns').value=q?.answer||'A';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveForm(){let q={id:editId||'custom-'+Date.now(),no:editId?(state.questions.find(x=>x.id===editId)?.no||1):Math.max(165,...state.questions.map(x=>x.no))+1,subject:document.getElementById('fSub').value,type:document.getElementById('fAns').value.length>1?'多选题':'单选题',question:document.getElementById('fQ').value,options:{A:document.getElementById('fA').value,B:document.getElementById('fB').value,C:document.getElementById('fC').value,D:document.getElementById('fD').value},answer:document.getElementById('fAns').value.toUpperCase().replace(/[^ABCD]/g,'').split('').filter((v,i,a)=>a.indexOf(v)===i).join(''),analysis:'自定义题目。',setId:currentSet}; if(!q.question.trim())return alert('请填写题目'); if(editId)state.questions=state.questions.map(x=>x.id===editId?q:x);else state.questions.push(q);saveState();closeModal();render()}
function closePdfScope(){
  const el=document.getElementById('pdfScope');
  if(el) el.style.display='none';
}
let pdfWindow=null;
function exportPDF(){
  const el=document.getElementById('pdfScope');
  if(el) el.style.display='flex'; else doExportPDF();
}
function doExportPDF(){
  closePdfScope();
  const choice=document.querySelector('input[name="pdfScopeChoice"]:checked')?.value||'current';
  let qs, title='题目汇总';
  if(choice==='current'){
    qs=allQs();
    title=(state.sets.find(s=>s.id===currentSet)?.name||'当前套卷')+'｜'+(subject||'全部科目');
  }else if(choice==='set'){
    qs=state.questions.filter(q=>q.setId===currentSet);
    title=(state.sets.find(s=>s.id===currentSet)?.name||'当前套卷')+'｜全部题目';
  }else{
    qs=state.questions.slice();
    title='题目汇总｜全部套卷';
  }
  if(!qs.length){alert('没有可导出的题目');return;}

  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const ans=q=>Array.isArray(q.answer)?q.answer.join('、'):String(q.answer||'');
  const opts=q=>Object.entries(q.options||{}).map(([k,v])=>`<div class="opt"><b>${k}.</b> ${esc(v||'')}</div>`).join('');
  const body=qs.map((q,i)=>{
    const img=q.analysisImage?`<img src="${q.analysisImage}" alt="解析图片">`:'';
    return `<section class="pdf-page">
      <h2>${i+1}. ${esc(q.question||'')}</h2>
      <div class="pdf-meta">科目：${esc(q.subject||'')}　题型：${esc(q.type||'A型')}</div>
      ${opts(q)}
      <div class="answer"><b>正确答案：</b>${esc(ans(q))}</div>
      ${q.analysis?`<div class="analysis"><b>文字解析：</b>${esc(q.analysis).replace(/\n/g,'<br>')}</div>`:''}
      ${img?`<div class="analysis"><b>解析图片：</b>${img}</div>`:''}
    </section>`;
  }).join('');

  // 不再依赖 window.open，避免 iPhone/Safari 拦截弹窗导致“无法导出”。
  // 直接在当前页面临时切换为打印内容，然后调用系统打印/存储 PDF。
  const old=document.body.innerHTML;
  document.body.innerHTML=`<main id="pdfPrintRoot"><h1>${esc(title)}</h1><div class="sub">共 ${qs.length} 题｜由「题目汇总」生成</div>${body}</main>`;
  const style=document.createElement('style');
  style.id='pdfTempStyle';
  style.textContent=`
    @page{size:A4;margin:14mm 12mm 16mm}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.65}
    #pdfPrintRoot{max-width:100%;padding:0}
    h1{text-align:center;font-size:22px;margin:0 0 6px}
    .sub{text-align:center;color:#666;font-size:12px;margin-bottom:20px}
    .pdf-page{page-break-inside:avoid;break-inside:avoid;margin:0 0 18px;border-bottom:1px solid #ddd;padding-bottom:14px}
    .pdf-page h2{font-size:15px;line-height:1.55;margin:0 0 5px}
    .pdf-meta{font-size:11px;color:#666;margin-bottom:8px}
    .opt{margin:2px 0}
    .answer{margin-top:8px}
    .analysis{margin-top:7px}
    img{display:block;max-width:100%;max-height:230mm;width:auto;height:auto;margin:8px auto;object-fit:contain}
  `;
  document.head.appendChild(style);
  const imgs=[...document.images];
  const restore=()=>{
    document.head.removeChild(style);
    document.body.innerHTML=old;
    // 恢复后重新绑定/渲染应用状态
    renderSets();render();
  };
  Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=r;img.onerror=r;})))
    .then(()=>setTimeout(()=>{
      window.print();
      // iOS 打印面板关闭后恢复原页面；部分浏览器 print 是阻塞式，部分不是。
      setTimeout(restore,800);
    },300));
}
function downloadCurrent(){
  const qs=allQs();
  const clone=document.documentElement.cloneNode(true);
  const app=clone.querySelector('#app');
  if(app){
    app.setAttribute('data-exported-count', qs.length);
    app.setAttribute('data-exported-set', currentSet);
    app.setAttribute('data-exported-subject', subject);
  }
  const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='题目汇总_'+(state.sets.find(s=>s.id===currentSet)?.name||'当前套卷')+'.html';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
renderSets();render();
</script></body></html>
